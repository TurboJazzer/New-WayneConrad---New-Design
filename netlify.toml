[build]
  command = "echo staging"
  publish = "."
  functions = "netlify/functions"
[functions]
  directory = "netlify/functions"
# Enforce .html as the single canonical URL form site-wide.
# Netlify's built-in Pretty URLs feature is deprecated and documented as
# unreliable when toggled off, so this is handled explicitly here instead.
# Strip Range header for crawlers to ensure full 200 OK HTML responses
[[edge_functions]]
  path = "/*.html"
  function = "strip-range"
[[edge_functions]]
  path = "/*.html"
  function = "serve-markdown"
[[edge_functions]]
  path = "/"
  function = "serve-markdown"
# Remove the ignored [[headers]] rule for Accept-Ranges = "none"
[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 301
  force = true
[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 301
  force = true
[[redirects]]
  from = "/ai-trust-gap"
  to = "/ai-trust-gap.html"
  status = 301
  force = true
[[redirects]]
  from = "/articles/real-cost-of-shadow-payroll.html"
  to = "/articles/hidden-friction-tax.html"
  status = 301
  force = true
# Allow public access to image files for social media crawlers
[[headers]]
  for = "/*.html"
  [headers.values]
    Accept-Ranges = "none"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Robots-Tag = "all"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Robots-Tag = "all"
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Robots-Tag = "all"
# Block WordPress/CMS exploit scanning paths
[[redirects]]
