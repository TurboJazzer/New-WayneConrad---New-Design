<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log out | Wayne Conrad Advisory</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shell.css">
<style>
:root{--navy:#0f172a;--navy2:#1e3a8a;--btn:#1d4ed8;--bd:#e2e8f0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#a9b8cd!important;color:#111827;font-family:var(--sys);font-size:17px;line-height:1.65}
@media(min-width:1200px){body{font-size:18px}}
.wrap{width:100%;max-width:1232px;margin:0 auto;padding:0 16px}
@media(min-width:760px){.wrap{padding:0 32px}}
.page-header{background:#0f172a;color:#fff;padding:36px 0 32px}
.page-header .eyebrow{margin:0 0 8px;color:#93c5fd;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.page-header h1{margin:0 0 10px;font-size:clamp(28px,5vw,40px);line-height:1.15;color:#fff}
.page-header p.sub{margin:0;max-width:62ch;color:#e2e8f0}
main{padding:32px 0 56px}
h2{color:#0f172a;font-size:22px;line-height:1.25;margin:0 0 10px}
h3{color:#0f172a;font-size:17px;margin:0 0 6px}
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr}}
.card{background:#f8fafc;border:1px solid #94a3b8;border-radius:10px;padding:24px}
.card p{margin:0 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:6px;background:#1d4ed8;color:#fff;border:2px solid #1d4ed8;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:#2563eb;border-color:#2563eb}
.btn.alt{background:#f8fafc;color:#1d4ed8}
.btn.alt:hover{background:#e2e8f0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 20px}
.note{margin:0 0 20px;padding:12px 16px;background:#f8fafc;border:1px solid #1d4ed8;border-left-width:6px;border-radius:6px;color:#0f172a;font-weight:600}
a{color:#1d4ed8}
:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px;border-radius:3px}
.page-header :focus-visible,.site-foot :focus-visible{outline-color:#93c5fd}
.status{min-height:24px;color:#0f172a;font-weight:600;margin:0 0 12px}
.doc{background:#dfe7f1;border:1px solid #94a3b8;border-radius:10px;padding:24px 20px;max-width:860px}
@media(min-width:760px){.doc{padding:40px 48px}}
.doc td{background:#e9eff6}
.doc th{background:#c9d6e6}
.doc h2{margin-top:28px;padding-top:4px}
.doc h2:first-child{margin-top:0}
.doc p,.doc li{margin:0 0 10px}
.doc ol,.doc ul{padding-left:22px;margin:0 0 12px}
.fill{background:#c3d2e6;border-bottom:2px solid #2563eb;padding:0 3px;color:#0f172a}
.tblw{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:15px}
td{background:#f8fafc}
th,td{border:1px solid #64748b;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#e2e8f0;color:#0f172a}
.sign{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.sign{grid-template-columns:1fr 1fr}}
.sign div{border:1px solid #94a3b8;border-radius:6px;padding:12px 14px}
/* stepper */
.rail{display:none;list-style:none;margin:0 0 28px;padding:0;position:relative;justify-content:space-between}
.rail:before{content:"";position:absolute;left:22px;right:22px;top:50%;height:3px;background:#94a3b8;transform:translateY(-50%)}
.rail li{position:relative}
.rail a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#f8fafc;border:3px solid #1e3a8a;color:#0f172a;font-weight:700;text-decoration:none}
.rail a.done{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
@media(min-width:900px){.rail{display:flex}}
.steps{list-style:none;margin:0 0 32px;padding:0;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:#f8fafc;border:1px solid #94a3b8;border-radius:10px;padding:18px 18px 14px;position:relative}
.step.done{border-color:#1d4ed8;background:#e8effc}
.step .n{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#1e3a8a;color:#fff;font-weight:700;margin-bottom:8px}
.step dl{margin:0 0 10px;font-size:15px}
.step dt{font-weight:700;color:#0f172a;margin-top:6px}
.step dd{margin:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;color:#0f172a;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:#1d4ed8;flex:none}
@media(max-width:899px){.steps{border-left:3px solid #1e3a8a;padding-left:14px;margin-left:12px}.step:before{content:"";position:absolute;left:-23px;top:26px;width:12px;height:12px;border-radius:50%;background:#1e3a8a}}
.rules{background:#f8fafc;border:2px solid #1e3a8a;border-radius:10px;padding:18px 22px;margin-top:20px}
.rules ul{margin:0;padding-left:22px}
@media print{
 .site-nav,.page-header,.site-foot,.bar,.status,.skip,.note-screen{display:none!important}
 body{background:#fff;color:#000;font-size:12pt}
 main{padding:0}.doc{border:0;padding:0;max-width:none}
 .doc h2{break-after:avoid}.doc table,.sign div{break-inside:avoid}
 .fill{background:none}
 .doc,.doc td,.doc th{background:#fff!important}
}

/* dark theme */
body{background:#000!important;color:#fff!important}
.page-header{background:#000;border-bottom:1px solid #334155}
h2,h3,.doc h2,.doc h3,.step dt,.chk,label{color:#fff}
a{color:#93c5fd}
.btn{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn:hover{background:#2563eb;border-color:#2563eb}
.btn.alt{background:#000;color:#fff;border-color:#93c5fd}
.btn.alt:hover{background:#1e293b}
.card,.doc,.step,.rules,.note{background:#0b0f19;border-color:#64748b;color:#fff}
.note{border-left-color:#93c5fd}
.step.done{background:#0c1d44;border-color:#93c5fd}
.step dd,.card p,.doc p,.doc li{color:#fff}
.rules{border-color:#93c5fd}
.status{color:#bfdbfe}
.fill{background:#1e293b;color:#fff;border-bottom-color:#93c5fd}
th{background:#1e293b;color:#fff}
td{background:#0b0f19;color:#fff}
.doc td{background:#0b0f19}.doc th{background:#1e293b}
th,td{border-color:#64748b}
.sign div{border-color:#64748b}
.rail:before{background:#64748b}
.rail a{background:#000;border-color:#93c5fd;color:#fff}
.rail a.done{background:#1d4ed8;border-color:#93c5fd}
.step .n{background:#1d4ed8}
:focus-visible{outline-color:#93c5fd}
@media(max-width:899px){.steps{border-left-color:#93c5fd}.step:before{background:#93c5fd}}
@media print{
 body{background:#fff!important;color:#000!important}
 .doc,.doc *{color:#000!important}
 .doc,.doc td,.doc th{background:#fff!important;border-color:#999}
 .doc th{background:#eee!important}
 .fill{background:none!important;border-bottom:1px solid #000}
}
</style>
</head>
